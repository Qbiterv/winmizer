name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" (e.g. 1.0.1). Builds and uploads artifacts; creates a GitHub Release only for tag pushes.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME } else { $v = '${{ inputs.version }}' }
          $v = $v -replace '^[vV]', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not in X.Y.Z form." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $v"

      - name: Build all (exe, zip, MSI for x64, arm64, x86)
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Smoke test (--list)
        shell: pwsh
        run: |
          $out = & (Join-Path $PWD 'publish/win-x64/Winmizer.exe') --list | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Winmizer --list exited with $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($out)) { throw 'Winmizer --list produced no output' }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location publish
          $files = Get-ChildItem -File -Include 'Winmizer-*.zip', 'Winmizer-*.msi' -Path . | Sort-Object Name
          if (-not $files) { throw 'No release files found in publish/' }
          $lines = $files | ForEach-Object { '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winmizer-${{ steps.ver.outputs.version }}
          path: |
            publish/Winmizer-*.zip
            publish/Winmizer-*.msi
            publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Winmizer-*.zip
            publish/Winmizer-*.msi
            publish/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
